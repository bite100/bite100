<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>比特100 · 存入子视图（第31轮设计演示）</title>
<link rel="stylesheet" href="demo.css">
</head>
<body>
<div class="phone">

  <!-- 子视图页头：返回 + 标题（存入/提取从资产主页撤下后走独立子视图） -->
  <div class="subbar">
    <a class="back" href="demo-assets-v2.html">‹</a>
    <div class="st">存入</div>
    <div class="spacer" style="flex:1"></div>
    <span class="demo-flag">设计演示 · 示意数据</span>
  </div>

  <div class="page" style="padding-bottom:calc(var(--tabbar-h) + 26px)">

    <div class="card">
      <div class="field" style="margin-top:0">
        <label>代币</label>
        <div class="type-row" style="margin-top:0">
          <span>USDT · TetherUS</span>
          <span class="tr-acts"><span style="font-size:11px">▾</span></span>
        </div>
      </div>
      <div class="field">
        <label>存入数量（钱包 → Vault）</label>
        <div class="inputbox">
          <input class="num" placeholder="0.00" readonly>
          <span class="unit">USDT</span>
          <button class="maxbtn">最大</button>
        </div>
      </div>
      <div class="avail"><span>钱包余额</span><span class="num">250.00 USDT</span></div>
      <div class="avail"><span>存入后 Vault 可用</span><span class="num">1,368.40 USDT 起（+本次存入）</span></div>
      <p class="hint" style="margin-top:12px">步骤：填入数量后点「存入」，在钱包中确认即可。首次存入需确认两次：代币授权与存入，之后可直接存入。注意：存入是链上交易，由你自己在钱包中确认（与下单、撤单只需签名不同）。</p>
      <div style="height:12px"></div>
      <button class="btn primary">存入</button>
      <p class="hint" style="margin-top:10px">存入到账后进入 Vault「可用」余额，可用于下单与结算；提取走资产页「提取」子视图：只能提取可用部分，挂单锁定的部分需先撤单释放。</p>
    </div>

  </div>

  <!-- 底部四栏（定版）：交易 / 行情 / 资产 / 其他 -->
  <nav class="tabbar">
      <a href="demo-trade-v2.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7 3v3M7 15v6M5 6h4v9H5zM17 2v4M17 14v8M15 6h4v8h-4z"/></svg>交易</a>
      <a href="demo-markets.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20V4M4 20h16M8 16v-5M12 16V8M16 16v-3"/></svg>行情</a>
      <a class="active" href="demo-assets-v2.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16.5 15h.01"/></svg>资产</a>
      <a href="demo-other.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>其他</a>
    </nav>
</div>
</body>
</html>
