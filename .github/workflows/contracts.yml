# 合约 CI：forge build + forge test（仅 contracts 目录变更时触发）
name: Contracts

on:
  push:
    branches: [main, master]
    paths:
      - "contracts/**"
      - ".github/workflows/contracts.yml"
      # 第 33 轮：治理 ABI 防漂移检查以前端声明为输入，改 config.ts 也须触发
      - "frontend/src/config.ts"
      - "frontend/scripts/check-governance-abi.mjs"
  pull_request:
    paths:
      - "contracts/**"
      - ".github/workflows/contracts.yml"
      - "frontend/src/config.ts"
      - "frontend/scripts/check-governance-abi.mjs"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Build contracts
        working-directory: contracts
        run: forge build

      # 第 33 轮：治理 ABI 防漂移——config.ts 手写的 GOVERNANCE_ABI 与
      # forge 产物逐条比对（第 32 轮漂移的根因是全手写无核对）。零依赖
      # 纯 Node 脚本，runner 预装 Node 即可。
      - name: Check governance ABI drift
        run: node frontend/scripts/check-governance-abi.mjs

      - name: Run contract tests
        working-directory: contracts
        run: forge test -v
