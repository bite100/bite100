# 节点 CI：go vet + go test（internal 包）
# 注：cmd/reputation-updater 是未完成的示例 stub（既有编译错误），暂不纳入；修复后可放开为 ./...
name: Node tests

on:
  push:
    branches: [main, master]
    paths:
      - "node/**"
      - ".github/workflows/node-tests.yml"
  pull_request:
    paths:
      - "node/**"
      - ".github/workflows/node-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: node/go.sum

      - name: Vet
        working-directory: node
        run: go vet ./internal/...

      - name: Test
        working-directory: node
        run: go test ./internal/...

  # 构建 node/Dockerfile（只 build 不 push）：防止 Dockerfile 的 Go 版本
  # 与 go.mod 再次漂移（第 32 轮加；此前 golang:1.24 对 go 1.26.8 必挂）。
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build node Docker image (no push)
        run: docker build -t p2p-node:ci-check -f node/Dockerfile node/
