# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
# Bit100 Settlement 成交索引器（第 34 轮，无节点阶段 2C；Envio HyperIndex v3）
#
# 部署记录来源（唯一口径）：docs/round47-cutover-2026-11-09.md（第 47 轮
# 永久撤单新栈切换；Settlement 本轮未改码，仅随栈重部署）。
# - Sepolia Settlement 0x5697F7B2178352eB391e29fc2c5681Dea864C1d9
#   CREATE tx 0xbd3556e5c56d8bb57bb4d7196d8e708ba434fc1a1f77904467bb3705fba6d249
#   → 部署块 12094697（2026-11-09 经公共 RPC 回执核对）
# - Base Sepolia Settlement 0x1021C7116cCE59f9c85683d6f1b5aD2215795949
#   CREATE tx 0x4dcbd91be8829457ead8e6f3b27f195e2f0156d8bb098dc5fb3b79fc9ff971ed
#   → 部署块 56357193（同上核对）
# ABI 版本标识：事件签名与 src/lib/settlementAbi.ts 同源于
# contracts/out/Settlement.sol/Settlement.json（第 47 轮部署栈）。合约重部署后
# 必须同步更新地址/起始块/本注释三处，并在轮次文档登记。
# 历史地址（旧轮次 Settlement）禁止抄入本文件——现行地址只认最新轮次文档。
name: bit100-settlement-indexer
description: Bit100 DEX Settlement 成交与 gas 分摊索引（双测试网，Envio HyperIndex）
# per-chain 数据模式（v3.6+）：实体与回滚按链隔离，双链同 id 互不干扰
disable_default_cross_chain: true
contracts:
  - name: Settlement
    events:
      # field_selection（v3）：声明 handler/测试实际读取的 transaction 字段，
      # 未声明的字段在生成类型里是 FieldNotSelected。block 的
      # number/timestamp/hash 为常选字段，无需（也不能）在此列出。
      # handler 注册处的 fields 选项与此处保持一致（注册处优先）。
      - event: "TradeSettled(address indexed maker, address indexed taker, address indexed tokenIn, address tokenOut, uint256 amountIn, uint256 amountOut, uint256 feeAmount)"
        field_selection:
          transaction_fields:
            - hash
            - input
            - from
      - event: "TradeSettledWithGasReimburse(address indexed maker, address indexed taker, address indexed tokenIn, address tokenOut, uint256 amountIn, uint256 amountOut, uint256 feeAmount, uint256 gasReimburseIn, uint256 gasReimburseOut, address gasRecipient)"
        field_selection:
          transaction_fields:
            - hash
            - input
            - from
      - event: "GasCostShared(address indexed maker, address indexed taker, address indexed gasRecipient, uint256 gasUsed, uint256 gasCostWei, uint8 reason, address makerToken, uint256 makerDeduct, uint256 makerShortfall, address takerToken, uint256 takerDeduct, uint256 takerShortfall)"
        field_selection:
          transaction_fields:
            - hash
chains:
  - id: 11155111
    start_block: 12094697
    contracts:
      - name: Settlement
        address: "0x5697F7B2178352eB391e29fc2c5681Dea864C1d9"
  - id: 84532
    start_block: 56357193
    contracts:
      - name: Settlement
        address: "0x1021C7116cCE59f9c85683d6f1b5aD2215795949"
