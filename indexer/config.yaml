# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
# Bit100 Settlement 成交索引器（第 34 轮，无节点阶段 2C；Envio HyperIndex v3）
#
# 部署记录来源（唯一口径）：docs/round62-nonce-bitmap-2026-11-10.md §12
# （第 62 轮 nonce 位图新 Settlement；Vault 改指不换，索引对象只换
# Settlement。第 47 轮部署记录见 docs/round47-cutover-2026-11-09.md。）
# - Sepolia Settlement 0xa38c087778d76DA30654F30CB87D1ddD83f7b263
#   CREATE tx 0xd8e7d3eef6a2b997a451a63616518224b47ebae518578952572583aa6cca54cc
#   → 部署块 12102776（2026-11-10 经公共 RPC 回执核对）
# - Base Sepolia Settlement 0x4969b9ACBe7Dbf57E150FcF413B622c2912e2e97
#   CREATE tx 0xb8e3fb3c00e4629805fc487cae057e4bad50b0e0ba0e5177b34df287985a60a5
#   → 部署块 56845937（同上核对）
# ABI 版本标识：事件签名与 src/lib/settlementAbi.ts 同源于
# contracts/out/Settlement.sol/Settlement.json（第 62 轮部署栈）。合约重部署后
# 必须同步更新地址/起始块/本注释三处，并在轮次文档登记。
# 历史地址（旧轮次 Settlement）禁止抄入本文件——现行地址只认最新轮次文档。
name: bit100-settlement-indexer
description: Bit100 DEX Settlement 成交与 gas 分摊索引（双测试网，Envio HyperIndex）
# per-chain 数据模式（v3.6+）：实体与回滚按链隔离，双链同 id 互不干扰
disable_default_cross_chain: true
contracts:
  - name: Settlement
    events:
      # field_selection（v3）：声明 handler/测试实际读取的 transaction 字段，
      # 未声明的字段在生成类型里是 FieldNotSelected。block 的
      # number/timestamp/hash 为常选字段，无需（也不能）在此列出。
      # handler 注册处的 fields 选项与此处保持一致（注册处优先）。
      - event: "TradeSettled(address indexed maker, address indexed taker, address indexed tokenIn, address tokenOut, uint256 amountIn, uint256 amountOut, uint256 feeAmount)"
        field_selection:
          transaction_fields:
            - hash
            - input
            - from
      - event: "TradeSettledWithGasReimburse(address indexed maker, address indexed taker, address indexed tokenIn, address tokenOut, uint256 amountIn, uint256 amountOut, uint256 feeAmount, uint256 gasReimburseIn, uint256 gasReimburseOut, address gasRecipient)"
        field_selection:
          transaction_fields:
            - hash
            - input
            - from
      - event: "GasCostShared(address indexed maker, address indexed taker, address indexed gasRecipient, uint256 gasUsed, uint256 gasCostWei, uint8 reason, address makerToken, uint256 makerDeduct, uint256 makerShortfall, address takerToken, uint256 takerDeduct, uint256 takerShortfall)"
        field_selection:
          transaction_fields:
            - hash
  # 第 63 轮 gas-2：gas库 GasVault（contracts/src/GasVault.sol，形态 A）。
  # 部署属部署步：下方 chains 的绑定（地址 + 起始块）在双链部署后按当轮文档
  # 填入，本轮先落合约定义 + schema 实体 + handler，部署步只补绑定三行。
  - name: GasVault
    events:
      - event: "Deposit(address indexed sender, address indexed owner, uint256 assets, uint256 shares)"
        field_selection:
          transaction_fields:
            - hash
      - event: "Withdraw(address indexed sender, address indexed receiver, address indexed owner, uint256 assets, uint256 shares)"
        field_selection:
          transaction_fields:
            - hash
      - event: "ConversionTriggered(address indexed caller, address indexed tokenIn, uint256 amountIn, uint256 assetReceived, uint256 minOut)"
        field_selection:
          transaction_fields:
            - hash
      - event: "ShortfallAbsorbed(bytes32 indexed claimId, address indexed beneficiary, uint256 amount, address indexed measurer)"
        field_selection:
          transaction_fields:
            - hash
      - event: "FloatFunded(address indexed from, uint256 amount)"
        field_selection:
          transaction_fields:
            - hash
chains:
  - id: 11155111
    start_block: 12102776
    contracts:
      - name: Settlement
        address: "0xa38c087778d76DA30654F30CB87D1ddD83f7b263"
  - id: 84532
    start_block: 56845937
    contracts:
      - name: Settlement
        address: "0x4969b9ACBe7Dbf57E150FcF413B622c2912e2e97"
